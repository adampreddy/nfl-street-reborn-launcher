[workspace]
resolver = "2"
members = ["crates/reborn-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-2.0-or-later"
repository = "https://github.com/adampreddy/nfl-street-reborn-launcher"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
