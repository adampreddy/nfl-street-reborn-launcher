[package]
name = "reborn-core"
description = "Platform-agnostic core for NFL Street Reborn Launcher"
version.workspace = true
edition.workspace = true
# NOT rust-version.workspace = true (which is 1.82). keyring and sysinfo both
# declare 1.88, so 1.82 would be a claim this crate cannot honor: the build
# fails on 1.82 with a confusing error from inside a dependency instead of a
# clear one here. The workspace value should follow, but that file is not this
# crate's to edit.
rust-version = "1.88"
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
fs4 = "0.13"
tracing.workspace = true

# The platform credential store, for platform::CredentialVault. Cross-platform
# on purpose: the default `v1` feature compiles in Windows Credential Manager,
# the macOS Keychain or the *nix Secret Service through target-gated optional
# dependencies, so a Windows build pulls only the Windows back end and the port
# needs no new code here. Chosen over calling wincred through windows-sys
# because this crate forbids unsafe. It has no mock or plaintext fallback: with
# no store reachable, every call fails, which is the required behavior for a
# vault.
keyring = "4.2"

# Volume enumeration with a removable flag, for platform::RemovableDrives, so
# the Xbox wizard cannot be handed a fixed disk to copy 3 GB onto.
# default-features = false drops the process, CPU, memory, network, user and
# component probing; only the disk module is used.
sysinfo = { version = "0.38", default-features = false, features = ["disk"] }
ureq = { version = "2", features = ["json"] }

# Ed25519, for the one signed object in the system: the release manifest.
# Chosen in CONTENT_AND_UPDATE_MODEL.md section 6 because the project has no
# certificate authority and no code signing at all, and Ed25519 needs neither.
# Verification is always compiled in. Signing needs random bytes for key
# generation and lives behind the `publish` feature, so a player's launcher
# never links a signer or a random source it has no use for.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = { version = "0.2", optional = true }

# SigV4 request signing for the R2 (S3-compatible) upload, behind `publish`
# for the same reason as `getrandom` above: a player's launcher never links a
# signer it has no use for. hmac pairs with the workspace's sha2 (0.10, so
# digest 0.10) rather than a newer major that would drag in a second sha2.
hmac = { version = "0.12", optional = true }
base64 = { version = "0.22", optional = true }
percent-encoding = { version = "2", optional = true }

# Reading a `.rebornroster` (a zip) to report its player and team counts,
# behind `publish` for the same reason as the three deps above: a player's
# launcher never opens a roster archive itself, only the publisher does,
# before pushing one. `default-features = false` plus `deflate-flate2` picks
# the one compression method a `.rebornroster` ever actually uses (DEFLATE)
# through flate2's pure-Rust `miniz_oxide` backend, which was already
# resolved in this workspace's lock file (ureq pulls it for gzip responses)
# rather than the default feature set's bzip2/lzma/zstd/aes-crypto/ppmd,
# none of which a roster export ever needs.
zip = { version = "5", optional = true, default-features = false, features = ["deflate-flate2"] }

[features]
# The publisher's half: key generation and signing. Enabled by reborn-cli only.
publish = ["dep:getrandom", "dep:hmac", "dep:base64", "dep:percent-encoding", "dep:zip"]

[target.'cfg(windows)'.dependencies]
rusty-xinput = "1.3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
