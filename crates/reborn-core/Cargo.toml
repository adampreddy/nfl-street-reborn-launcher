[package]
name = "reborn-core"
description = "Platform-agnostic core for NFL Street Reborn Launcher"
version.workspace = true
edition.workspace = true
# NOT rust-version.workspace = true (which is 1.82). keyring and sysinfo both
# declare 1.88, so 1.82 would be a claim this crate cannot honor: the build
# fails on 1.82 with a confusing error from inside a dependency instead of a
# clear one here. The workspace value should follow, but that file is not this
# crate's to edit.
rust-version = "1.88"
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
fs4 = "0.13"
tracing.workspace = true

# The platform credential store, for platform::CredentialVault. Cross-platform
# on purpose: the default `v1` feature compiles in Windows Credential Manager,
# the macOS Keychain or the *nix Secret Service through target-gated optional
# dependencies, so a Windows build pulls only the Windows back end and the port
# needs no new code here. Chosen over calling wincred through windows-sys
# because this crate forbids unsafe. It has no mock or plaintext fallback: with
# no store reachable, every call fails, which is the required behavior for a
# vault.
keyring = "4.2"

# Volume enumeration with a removable flag, for platform::RemovableDrives, so
# the Xbox wizard cannot be handed a fixed disk to copy 3 GB onto.
# Dolphin process detection uses query-only Windows APIs in platform/runtime_process.rs.
sysinfo = { version = "0.38", default-features = false, features = ["disk"] }
ureq = { version = "2", features = ["json"] }

# Custom soundtrack. All pure Rust: this crate forbids unsafe and the
# launcher ships no ffmpeg (SECURITY_PRIVACY_LICENSING.md section 24).
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "aiff", "pcm"] }
lofty = "0.22"

# Ed25519, for the one signed object in the system: the release manifest.
# Chosen in CONTENT_AND_UPDATE_MODEL.md section 6 because the project has no
# certificate authority and no code signing at all, and Ed25519 needs neither.
# Verification is always compiled in. Signing needs random bytes for key
# generation and lives behind the `publish` feature, so a player's launcher
# never links a signer or a random source it has no use for.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = { version = "0.2", optional = true }

# SigV4 request signing for the R2 (S3-compatible) upload, behind `publish`
# for the same reason as `getrandom` above: a player's launcher never links a
# signer it has no use for. hmac pairs with the workspace's sha2 (0.10, so
# digest 0.10) rather than a newer major that would drag in a second sha2.
hmac = { version = "0.12", optional = true }
base64 = { version = "0.22", optional = true }
percent-encoding = { version = "2", optional = true }

# Zip archives, for two unrelated things that both happen to be zips: a
# custom soundtrack `.nsrmusic` pack, read and written unconditionally by the
# soundtrack module, and a `.rebornroster` behind `publish`, opened only by
# the Publisher to report its player and team counts before pushing one.
# Not optional: the soundtrack path needs it in every player launcher build,
# which already outweighs the point of gating it behind `publish`.
# `default-features = false` plus `deflate-flate2` picks the one compression
# method either kind of archive ever actually uses (DEFLATE) through flate2's
# pure-Rust `miniz_oxide` backend, which was already resolved in this
# workspace's lock file (ureq pulls it for gzip responses) rather than the
# default feature set's bzip2/lzma/zstd/aes-crypto/ppmd, none of which either
# use case ever needs.
zip = { version = "5", default-features = false, features = ["deflate-flate2"] }
discord-rich-presence = "1.1.0"

[features]
# The publisher's half: key generation and signing. Enabled by reborn-cli only.
publish = ["dep:getrandom", "dep:hmac", "dep:base64", "dep:percent-encoding"]

[target.'cfg(windows)'.dependencies]
rusty-xinput = "1.3"
# The store `keyring` itself drives, named directly for one call: an entry with
# the `persistence` modifier, which `keyring::Entry` does not expose. Same crate
# instance as keyring's (already in Cargo.lock), so it sees the store keyring set.
keyring-core = "1"
# Win32_UI_Shell and Win32_UI_WindowsAndMessaging are both here for one call,
# ShellExecuteW, which is how platform::imp::open_url hands a link to the shell.
# Two features rather than one because windows-sys declares the function in the
# Shell module but gates that declaration, and SW_SHOWNORMAL, on
# WindowsAndMessaging.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
