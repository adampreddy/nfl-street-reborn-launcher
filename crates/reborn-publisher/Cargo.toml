[package]
name = "reborn-publisher"
description = "The Reborn Publisher window: plan, run, verify, over reborn_core::publish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "reborn-publisher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `publish` is the publisher's half of the core: key generation, signing,
# the journal, upload. A player's launcher never links any of it; this is
# the one window that does.
reborn-core = { path = "../reborn-core", features = ["publish"] }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
rfd = "0.15"

# `set.rs`'s Run step opens the zip `build.ps1` just produced and reads its
# central directory (names only, nothing decompressed) to independently
# confirm it holds exactly the setup exe and its own numbered slices before
# uploading it -- the "never trust the tool's own claim" rule every other
# page in this app already follows. Same version and minimal feature set
# reborn-core already resolves transitively for its own `publish` feature
# (`roster.rs` reads a `.rebornroster`, which is a zip, the same way); a
# regular dependency here rather than relying on that transitive one, since
# this crate's own production code, not only its tests, now opens one.
zip = { version = "5", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
# `ops.rs`'s tests run every operation against a fresh tempdir rather than
# this machine's real publishing origin. Same version reborn-core already
# pins for the same reason.
tempfile = "3"
