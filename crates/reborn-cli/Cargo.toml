[package]
name = "reborn-cli"
description = "Command line front end for the NFL Street Reborn Launcher core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rebornctl"
path = "src/main.rs"

[dependencies]
# `publish` brings in key generation and signing. This is the tool that
# publishes releases, so it is the one binary that may carry a signer.
reborn-core = { path = "../reborn-core", features = ["publish"] }
clap = { version = "4", features = ["derive"] }
