<link rel="stylesheet" href="templates/xbox-one/template.css">
<script src="templates/_shared/controller.js"></script>
<div class="triggers">
	<span class="trigger left" data-pad-button="6"></span>
	<span class="trigger right" data-pad-button="7"></span>
	<span class="clear"></span>
</div>
<div class="bumpers">
	<span class="bumper left" data-pad-button="4"></span>
	<span class="bumper right" data-pad-button="5"></span>
	<span class="clear"></span>
</div>
<div class="meta" data-pad-button="16"></div>
<div class="arrows">
	<span class="select" data-pad-button="8"></span>
	<span class="start" data-pad-button="9"></span>
	<span class="clear"></span>
</div>
<div class="buttons">
	<span class="pad-button a" data-pad-button="0"></span>
	<span class="pad-button b" data-pad-button="1"></span>
	<span class="pad-button x" data-pad-button="2"></span>
	<span class="pad-button y" data-pad-button="3"></span>
</div>
<div class="sticks">
	<span class="stick left" data-pad-button="10" data-axis-x="0" data-axis-y="1"></span>
	<span class="stick right" data-pad-button="11" data-axis-x="2" data-axis-y="3"></span>
</div>
<div class="dpad">
	<span class="face up" data-pad-button="12"></span>
	<span class="face down" data-pad-button="13"></span>
	<span class="face left" data-pad-button="14"></span>
	<span class="face right" data-pad-button="15"></span>
</div>
