<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFL Street Reborn, advanced</title>
    <link rel="stylesheet" href="harness.css" />
  </head>
  <body>
    <!--
      Every command as a row, every answer raw. This is the debugging page, and
      it is deliberately undesigned: it exists so a feature can be exercised the
      moment it exists, and so the checkers in Tools/ have something to hold
      against the Rust signatures. The pages a player uses are the plain shell:
      Play, Mods, Controls, Settings.
    -->
    <header>
      <strong>NFL Street Reborn</strong>
      <span class="sub">advanced. Every command, raw. For debugging.</span>
      <a href="index.html" class="pill">back to Play</a>
      <span id="bridge" class="pill">checking</span>
    </header>

    <main>
      <section id="settings">
        <h2>Paths</h2>
        <p class="note">
          The same values the Settings page keeps. Needed before Play works.
        </p>
        <div id="settings-rows"></div>
      </section>

      <section id="features"></section>
    </main>

    <aside>
      <div class="out-head">
        <strong>Output</strong>
        <button id="clear" type="button">Clear</button>
      </div>
      <pre id="out">Ready.</pre>
    </aside>

    <script type="module" src="app.js"></script>
  </body>
</html>
