<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFL Street Reborn Launcher, harness</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      A test harness, not a product interface.

      Every feature gets one labelled control and every answer is shown raw.
      There is deliberately no visual design here: the real interface is being
      designed separately, and a half-styled stand-in would only compete with
      it. What this needs to be is complete and honest, so a feature can be
      exercised the moment it exists.
    -->
    <header>
      <strong>NFL Street Reborn Launcher</strong>
      <span class="sub">test harness. Not the real interface.</span>
      <span id="bridge" class="pill">checking</span>
    </header>

    <main>
      <section id="settings">
        <h2>Paths</h2>
        <p class="note">
          Saved in this window only. Needed before Play works.
        </p>
        <div id="settings-rows"></div>
      </section>

      <section id="features"></section>
    </main>

    <aside>
      <div class="out-head">
        <strong>Output</strong>
        <button id="clear" type="button">Clear</button>
      </div>
      <pre id="out">Ready.</pre>
    </aside>

    <script type="module" src="app.js"></script>
  </body>
</html>
