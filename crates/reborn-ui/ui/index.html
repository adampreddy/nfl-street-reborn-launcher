<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFL Street Reborn</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="shell">
      <header id="topbar">
        <span class="brand">NSR</span>
        <span id="page-title">Home</span>
        <div class="topbar-right">
          <span id="runtime-state">no runtime selected</span>
        </div>
      </header>

      <nav id="rail" aria-label="Sections"></nav>

      <main id="content" tabindex="-1"></main>

      <footer id="hints">
        <span class="hint"><span class="glyph">A</span> Select</span>
        <span class="hint"><span class="glyph">B</span> Back</span>
        <span class="hint"><span class="glyph">LB</span><span class="glyph">RB</span> Section</span>
        <span class="hints-right">
          <span><span class="dot off" id="pad-dot"></span> <span id="pad-state">no controller</span></span>
        </span>
      </footer>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
